server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les en-têtes de sécurité sont posés une fois pour tout le serveur, et non
    # dans « location / » seulement : un bloc plus spécifique remplace la liste
    # entière des add_header du bloc parent, si bien qu'une règle ajoutée
    # ensuite pour les polices ou le plan du site les perdait silencieusement.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Ce site est volontairement indexable : c'est la seule surface publique du
    # produit. Aucun X-Robots-Tag ici, contrairement à l'application.

    # URL sans extension : /confidentialite plutôt que /confidentialite.html.
    # C'est ce qui est déclaré dans le plan du site, les liens canoniques et
    # l'écran de consentement Google — servir les deux formes ferait deux
    # adresses pour une même page, ce que l'indexation pénalise.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Polices : leur nom est stable, mais leur contenu aussi. Un an de cache,
    # et un renommage suffit à forcer le rechargement.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # La feuille de style change avec le site : une journée, pas un an, faute
    # d'empreinte dans son nom.
    location = /styles.css {
        expires 1d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
