server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Application à page unique : toute route inconnue retombe sur index.html, sans
    # quoi /join/{token} renverrait 404 lors d'un accès direct depuis une invitation.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/nginx-securite.conf;
    }

    # Ressources versionnées par empreinte : cache long sans risque.
    location ~* \.(js|css|woff2|png|jpg|svg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/nginx-securite.conf;
    }

    # index.html et le service worker ne doivent jamais être mis en cache, faute de
    # quoi une nouvelle version ne serait jamais prise en compte.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/nginx-securite.conf;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/nginx-securite.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
