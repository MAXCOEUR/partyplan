name: partyplan
description: "PartyPlan — organisation d'événements entre amis."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # État applicatif
  flutter_riverpod: ^3.3.2

  # Navigation et liens profonds (/join/{token})
  go_router: ^17.5.0

  # Appels HTTP
  dio: ^5.9.0

  # Stockage du jeton de session
  flutter_secure_storage: ^11.0.0

  # Formats français : dates JJ/MM/AAAA, montants en euros
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Polices embarquées : aucun téléchargement à l'exécution, le développement
  # fonctionne hors ligne (NF-DEV-02).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
