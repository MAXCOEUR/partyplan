name: partyplan
description: "PartyPlan — organisation d'événements entre amis."
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # État applicatif
  flutter_riverpod: ^3.3.2

  # Navigation et liens profonds (/join/{token})
  go_router: ^17.5.0

  # Appels HTTP
  dio: ^5.9.0

  # Temps réel (§9). Client SignalR en Dart pur : la négociation, la reconnexion et le
  # protocole de trame de SignalR ne se réécrivent pas à la main.
  signalr_netcore: ^1.4.4

  # Connexion Google (EF-AUTH-06). Sans identifiant client injecté à la
  # compilation, le paquet est présent mais inerte : le bouton n'apparaît pas et
  # l'inscription par mot de passe suffit (NF-DEV-05, règle 5).
  google_sign_in: ^7.2.0
  # Dépendance directe et non transitive : le bouton du Web est rendu par le SDK
  # Google, et son widget ne s'obtient que par l'API « web_only » de ce greffon.
  google_sign_in_web: ^1.1.3

  # Notifications poussées. Sans google-services.json ni configuration web, ces paquets
  # sont présents mais inertes : l'initialisation échoue proprement et l'application
  # fonctionne sans notifications (règle 5).
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2

  # Maintenu sous la version 3.11 : celle-ci appelle l'extension `isA` sur l'objet
  # capturé par un `catch`, que le Dart livré avec Flutter 3.38 type en `Object` et non
  # en `JSAny`. La compilation web échoue alors, alors qu'Android passe et que
  # `flutter analyze` ne voit rien — l'analyse ne compile pas les greffons web.
  # À relever avec la prochaine mise à jour de Flutter.
  firebase_core_web: ">=3.10.0 <3.11.0"

  # Stockage du jeton de session.
  #
  # Volontairement maintenu sous la version 11 : celle-ci se compile contre le SDK
  # Android 37, dont la seule plateforme disponible se nomme « android-37.0 » alors que
  # Gradle recherche « android-37 ». Le décalage de nommage des plateformes en
  # préversion rend la construction impossible. À relever quand android-37 sera
  # distribué sous ce nom.
  flutter_secure_storage: ">=10.3.1 <11.0.0"

  # Magasin du cache de lecture et de la file d'écritures (NF-OFFLINE-01).
  # Retenu parce que c'est la seule option identique sur Android, iOS et Web sans
  # étape de compilation native — et le Web est une cible de publication.
  shared_preferences: ^2.5.3

  # Feuille de partage native : lien d'invitation et QR code (EF-INV-02).
  # Version 13 et non 12 : share_plus 12 épingle win32 ^5.5.3, incompatible avec
  # file_picker 12 qui exige win32 ^6.3.0.
  share_plus: ^13.3.0

  # Formats français : dates JJ/MM/AAAA, montants en euros
  intl: ^0.20.2

  # Chaînes traduites générées depuis lib/l10n/arb (NF-I18N-01)
  flutter_localizations:
    sdk: flutter

  # Uniquement pour la police d'icônes réclamée par les libellés Cupertino, qu'aucun
  # écran n'utilise mais qu'il faut déclarer — voir PartyPlanApp.delegues.
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  file_picker: ^12.0.0
  image_cropper: ^12.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Génère PpL10n depuis les fichiers ARB, selon l10n.yaml.
  generate: true

  assets:
    # Le logo, décliné par tools/ vers web/icons et android/.../mipmap-*. La source
    # reste assets/brand/logo.svg : c'est elle qu'on modifie, jamais les PNG.
    - assets/brand/logo.png

  # Polices embarquées : aucun téléchargement à l'exécution, le développement
  # fonctionne hors ligne (NF-DEV-02).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
