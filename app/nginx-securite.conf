# En-têtes de sécurité.
#
# Fichier inclus dans chaque bloc `location`, et non déclaré une seule fois au niveau
# du serveur : dès qu'un bloc `location` contient son propre `add_header`, nginx
# ignore tous les `add_header` héritables des niveaux supérieurs. Une déclaration
# unique au niveau serveur disparaîtrait donc silencieusement sur les emplacements qui
# fixent leur cache.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
