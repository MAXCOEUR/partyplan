# PartyPlan — pile de production (exemple)
#
# Ce fichier ne compile rien : il tire les images publiées par l'intégration
# continue sur GitHub Container Registry. La compilation locale est décrite dans
# `compose.yml`.
#
#   cp infra/compose/.env.example infra/compose/.env
#   docker compose --env-file infra/compose/.env -f infra/compose/compose.example.yml pull
#   docker compose --env-file infra/compose/.env -f infra/compose/compose.example.yml up -d
#
# Le registre GHCR est privé par défaut. Si le paquet n'est pas rendu public :
#   echo $GHCR_TOKEN | docker login ghcr.io -u <utilisateur> --password-stdin

name: partyplan

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------- base ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Comparaisons insensibles à la casse cohérentes avec citext.
      LANG: fr_FR.utf8
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    # Aucun port publié : la base n'est joignable que depuis le réseau interne.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------- api ----
  api:
    image: ghcr.io/${GHCR_OWNER}/partyplan-api:${API_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=40
      # Authentification
      Jwt__Issuer: https://${DOMAIN_API}
      Jwt__Audience: partyplan-app
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # Trois identifiants clients : Google émet un jeton par plateforme et l'audience
      # diffère à chaque fois.
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Google__AndroidClientId: ${GOOGLE_ANDROID_CLIENT_ID}
      Google__IosClientId: ${GOOGLE_IOS_CLIENT_ID}
      Apple__ClientId: ${APPLE_CLIENT_ID}
      Apple__TeamId: ${APPLE_TEAM_ID}
      Apple__KeyId: ${APPLE_KEY_ID}
      # Amorçage de l'administrateur au premier démarrage — RG-ADM-09 à RG-ADM-12.
      # Le démarrage échoue si le mot de passe est absent alors qu'aucun administrateur
      # n'existe, ou s'il ne satisfait pas RG-AUTH-01.
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      # Origine autorisée : l'application web, et elle seule.
      #
      # La vitrine n'y figure pas : c'est un site statique qui n'appelle pas l'API. Elle
      # présente le produit et renvoie vers les magasins ou vers l'application. Lui
      # ouvrir CORS élargirait la surface pour un besoin qui n'existe pas.
      Cors__AllowedOrigins__0: https://${DOMAIN_APP}
      App__PublicBaseUrl: https://${DOMAIN_APP}
      App__CdnBaseUrl: https://${DOMAIN_CDN}
      # Médias : sans cette injection, la valeur par défaut du code renverrait des
      # adresses de photos pointant vers localhost — invisible en développement, cassé
      # en production.
      Media__RootPath: /var/lib/partyplan/media
      Media__PublicBaseUrl: https://${DOMAIN_CDN}
      # Migrations appliquées au démarrage (§13.3), limitation de débit active.
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "false"
      RateLimiting__Enabled: "true"
      RateLimiting__GlobalPerMinute: "300"
      RateLimiting__ShortCodePerMinute: "10"
      RateLimiting__PasswordResetPerHour: "10"
      RateLimiting__AuthAttemptsPerMinute: "20"
      # Courriel transactionnel (liens magiques, repli de notification)
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
      # Notifications poussées
      Push__FirebaseServiceAccountPath: ${FIREBASE_SERVICE_ACCOUNT_PATH}
    volumes:
      # Pièces jointes et images de couverture, servies ensuite par le proxy sur le CDN.
      - media:/var/lib/partyplan/media
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ------------------------------------------------- application web (PWA) ----
  web:
    image: ghcr.io/${GHCR_OWNER}/partyplan-web:${APP_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    networks:
      - edge

  # ------------------------------------------------------ site vitrine ----
  landing:
    image: ghcr.io/${GHCR_OWNER}/partyplan-landing:${LANDING_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks:
      - edge

  # ------------------------------------------------------ reverse proxy ----
  # Caddy obtient et renouvelle un certificat par nom en challenge HTTP-01,
  # conformément à docs/adr/0003-domaines.md. Aucun joker, donc aucun accès
  # DNS requis.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
      - web
      - landing
    environment:
      DOMAIN_APP: ${DOMAIN_APP}
      DOMAIN_API: ${DOMAIN_API}
      DOMAIN_LANDING: ${DOMAIN_LANDING}
      DOMAIN_CDN: ${DOMAIN_CDN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - media:/srv/media:ro
    networks:
      - edge

  # ------------------------------------------------------- sauvegardes ----
  # Vidage quotidien, rétention 30 jours (NF-OPS-04). Le dépôt hors serveur
  # (objet distant, rsync) reste à brancher sur le volume `backups`.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    networks:
      - internal
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'while true; do
         f=/backups/partyplan-$$(date +%Y%m%d-%H%M%S).sql.gz;
         pg_dump -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} | gzip > "$$f" \
           && echo "sauvegarde $$f" \
           || echo "ECHEC de sauvegarde";
         find /backups -name "partyplan-*.sql.gz" -mtime +30 -delete;
         sleep 86400;
       done'

networks:
  # Base et API : jamais exposé au proxy.
  internal:
    internal: true
  # Services joignables par le reverse proxy.
  edge: {}

volumes:
  db-data: {}
  media: {}
  backups: {}
  caddy-data: {}
  caddy-config: {}
