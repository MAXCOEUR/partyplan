# PartyPlan — pile de développement local
#
# Compile les images depuis les sources du dépôt et publie les ports sur l'hôte.
# Pas de TLS, pas de reverse proxy : voir `compose.example.yml` pour la production.
#
#   cp .env.example .env                     (à la racine du dépôt)
#   docker compose -f infra/compose/compose.yml up -d db     # base seule
#   docker compose -f infra/compose/compose.yml up -d --build

name: partyplan-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partyplan}
      POSTGRES_USER: ${POSTGRES_USER:-partyplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partyplan}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Port décalé par défaut : 5432 est fréquemment occupé par un autre projet
      # sur le poste. Surchargeable par DB_PORT.
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-partyplan};Username=${POSTGRES_USER:-partyplan};Password=${POSTGRES_PASSWORD:-partyplan}
      Jwt__Issuer: http://localhost:${API_PORT:-5080}
      Jwt__Audience: partyplan-app
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-cle_de_developpement_non_secrete_32c}
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-8080}
      # Amorçage de l'administrateur — RG-ADM-09. Ces identifiants sont connus et
      # documentés : RG-ADM-11 les refuse en production.
      Admin__Email: ${ADMIN_EMAIL:-admin@partyplan.local}
      Admin__Password: ${ADMIN_PASSWORD:-MotDePasseDeDeveloppement}
      # Courriel capturé par Mailpit — NF-DEV-03
      Smtp__Host: mail
      Smtp__Port: 1025
      Smtp__From: PartyPlan (dev) <dev@partyplan.local>
      # Connexions tierces désactivées par défaut en local — NF-DEV-05
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__AndroidClientId: ${GOOGLE_ANDROID_CLIENT_ID:-}
      Google__IosClientId: ${GOOGLE_IOS_CLIENT_ID:-}
      # Notifications poussées journalisées en console faute de clé — NF-DEV-04
      Push__FirebaseServiceAccountJson: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      # Chiffrement des secrets de double authentification
      Security__EncryptionKey: ${SECURITY_ENCRYPTION_KEY:-Y2xlLWRlLWNoaWZmcmVtZW50LWRlLWRldi0zMi1vY3Q=}
      Totp__Name: PartyPlan (dev)
      App__PublicBaseUrl: http://localhost:${WEB_PORT:-8080}
      Media__RootPath: /tmp/partyplan-media
      Media__PublicBaseUrl: http://localhost:${API_PORT:-5080}/media
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: ${SEED_DEMO:-true}
      RateLimiting__Enabled: "true"
    ports:
      - "${API_PORT:-5080}:8080"

  web:
    build:
      context: ../../app
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:${API_PORT:-5080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  landing:
    build:
      context: ../../landing
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-8081}:80"

  # Capture des courriels sortants — NF-DEV-03. Aucun message ne part vers une
  # adresse réelle depuis un poste de développement. Interface : http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

# Redis volontairement absent : à introduire uniquement sur besoin mesuré
# (cache, ou backplane SignalR dès la deuxième instance d'API — RG-RT-04),
# avec un ADR préalable.

volumes:
  db-data: {}
