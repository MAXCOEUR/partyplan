# PartyPlan — pile de production pour NAS derrière Nginx Proxy Manager
#
# ============================================================================
#  DÉPLOIEMENT
# ============================================================================
#
#  Deux fichiers à déposer, et un dossier de données à préparer :
#
#      partyplan/
#        ├── docker-compose.yml   ← ce fichier
#        ├── .env                 ← les valeurs, jamais versionnées
#        └── donnees/
#            ├── db/              base PostgreSQL
#            ├── media/           photos de profil et images d'événements
#            └── sauvegardes/     vidages quotidiens
#
#  Le nom `.env` est imposé par Docker Compose, qui le lit automatiquement dans
#  le répertoire du fichier compose. Un fichier nommé autrement est ignoré sans
#  message : les variables seraient alors vides et le démarrage refusé.
#
#  Les données sont dans des dossiers visibles plutôt que dans des volumes
#  Docker : sur un NAS, on veut pouvoir les parcourir, les sauvegarder avec les
#  outils de la machine, et les copier ailleurs sans passer par Docker.
#
#      docker compose pull && docker compose up -d
#
#  Rien d'autre à préparer : le service `media-init` crée `donnees/media` et
#  l'attribue à l'utilisateur du conteneur d'API avant que celui-ci démarre.
#
#  Une nuance sur `donnees/db` : PostgreSQL ajuste ce dossier tout seul au
#  premier démarrage, mais il exige des droits 0700 et se l'attribue. Le dossier
#  sera donc visible sans être parcourable autrement qu'en root. `media/` et
#  `sauvegardes/` le sont normalement, et c'est `sauvegardes/` qui contient ce
#  qu'on veut vraiment lire : des vidages `.sql.gz` exploitables.
#
#  POUR TOUT SUPPRIMER : `docker compose down` puis effacer `donnees/`. Le
#  dossier `db/` appartient à un autre utilisateur, il faut donc être root, ou
#  passer par Docker :
#      docker run --rm -v "$PWD/donnees:/d" alpine rm -rf /d
#
#  Ce fichier diffère de `compose.example.yml` sur un point d'architecture : pas
#  de reverse proxy Caddy, parce que Nginx Proxy Manager tient déjà ce rôle.
#  Chaque service publie donc un port sur l'hôte, que NPM va chercher.
#
# ---------------------------------------------------------------------------
#  1. AVANT LE PREMIER DÉMARRAGE
# ---------------------------------------------------------------------------
#
#  a) Rendre les trois paquets GHCR publics, sinon le NAS ne peut pas les
#     télécharger : https://github.com/MAXCOEUR?tab=packages
#     → partyplan-api, partyplan-web, partyplan-landing
#     → chacun : Package settings → Change visibility → Public
#
#  b) Renseigner `.env` — voir `.env.nas.example`.
#
#  c) Vérifier que les ports 1000 à 1003 sont libres.
#
# ---------------------------------------------------------------------------
#  2. NGINX PROXY MANAGER
# ---------------------------------------------------------------------------
#
#  ┌──────────────────────────────────────┬────────────────────┬───────────────┐
#  │ Domaine                              │ Destination        │ À cocher      │
#  ├──────────────────────────────────────┼────────────────────┼───────────────┤
#  │ partyplan.maxencecoeur.fr            │ 192.168.0.248:1000 │ SSL, Force    │
#  │ (site vitrine, indexable)            │                    │ SSL, HTTP/2,  │
#  │                                      │                    │ HSTS          │
#  ├──────────────────────────────────────┼────────────────────┼───────────────┤
#  │ web.partyplan.maxencecoeur.fr        │ 192.168.0.248:1003 │ idem          │
#  │ (application Flutter Web)            │                    │               │
#  ├──────────────────────────────────────┼────────────────────┼───────────────┤
#  │ api.partyplan.maxencecoeur.fr        │ 192.168.0.248:1001 │ idem, plus    │
#  │                                      │                    │ Websockets    │
#  ├──────────────────────────────────────┼────────────────────┼───────────────┤
#  │ cdn.partyplan.maxencecoeur.fr        │ 192.168.0.248:1002 │ idem          │
#  └──────────────────────────────────────┴────────────────────┴───────────────┘
#
#  Websockets sur l'API : obligatoire. Le hub SignalR vit sur `/hubs/*` du
#  domaine de l'API (ADR 0003). Sans cette case, la mise à jour en temps réel
#  du lot 1.6 échouera silencieusement en repli sur du long polling.
#
#  HSTS : le seul en-tête de sécurité que les images ne portent pas
#  elles-mêmes. Caddy le posait ; ici c'est NPM qui termine le TLS, donc c'est
#  à lui de le poser. Les autres (nosniff, X-Frame-Options, Referrer-Policy)
#  sont déjà émis par l'API et par les images web et vitrine — ne pas les
#  redéclarer dans NPM, ils seraient dupliqués.
#
#  Sur l'hôte du CDN uniquement, onglet « Advanced » :
#
#      add_header Access-Control-Allow-Origin * always;
#      add_header Cache-Control "public, max-age=31536000, immutable" always;
#
#  La première n'est pas optionnelle : l'application et les photos sont sur deux
#  domaines, et sans elle le navigateur reçoit l'image puis la jette. Elle
#  s'affiche « indisponible », avec un 200 côté serveur et aucune erreur nulle
#  part. L'étoile n'ouvre rien, ces fichiers étant déjà publics.
#
# ---------------------------------------------------------------------------
#  3. CE QUI N'EST PAS ENCORE ACTIF, ET POURQUOI CE N'EST PAS BLOQUANT
# ---------------------------------------------------------------------------
#
#  Connexion Google : les identifiants sont lus depuis `.env`. Vides, aucun
#  bouton Google n'apparaît et l'inscription par mot de passe fonctionne
#  (NF-DEV-05). Sur le Web il n'y a de toute façon pas encore de bouton.
#
#  Notifications poussées : sans clé de compte de service, elles sont
#  journalisées et rien ne part (NF-DEV-04). Aucune action métier n'échoue pour
#  autant.
#
#  Android : hors de cette pile. L'application se publie par Google Play.
#
# ---------------------------------------------------------------------------
#  4. LIMITE CONNUE
# ---------------------------------------------------------------------------
#
#  Les ports 1000 à 1003 sont ouverts sur le réseau local. L'API fait confiance
#  à l'en-tête `X-Forwarded-For` sans liste de proxys autorisés, ce qui est
#  correct derrière NPM mais permet à une machine du LAN d'usurper une adresse
#  et de contourner la limitation de débit par IP (RG-AUTH-05). Acceptable sur
#  un réseau domestique, à revoir le jour où le NAS héberge de vrais
#  utilisateurs.

name: partyplan

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------- base ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partyplan}
      POSTGRES_USER: ${POSTGRES_USER:-partyplan}
      # « :? » fait échouer le démarrage si la valeur manque. Sans cela, Compose
      # substituerait une chaîne vide et PostgreSQL démarrerait sans mot de
      # passe — un démarrage silencieux est la pire des deux issues.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      # Comparaisons insensibles à la casse cohérentes avec citext.
      LANG: fr_FR.utf8
    volumes:
      - ${DATA_PATH:-./donnees}/db:/var/lib/postgresql/data
    networks:
      - internal
    # Aucun port publié : la base n'est joignable que depuis le réseau interne.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-partyplan} -d ${POSTGRES_DB:-partyplan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------- préparation du média ----
  # L'API écrit les photos sans privilèges, sous l'uid 1654, et Docker ne change
  # jamais les droits d'un dossier monté depuis l'hôte. Sans ce service, l'API
  # démarre normalement et seul le premier envoi de photo échoue en 500.
  # `a+rX` en plus : le CDN lit ce même dossier sous un autre utilisateur.
  media-init:
    image: alpine:3.20
    logging: *logging
    command: ["sh", "-c", "mkdir -p /media && chown -R 1654:1654 /media && chmod -R a+rX /media"]
    volumes:
      - ${DATA_PATH:-./donnees}/media:/media
    restart: "no"

  # ----------------------------------------------------------------- api ----
  api:
    image: ghcr.io/${GHCR_OWNER:-maxcoeur}/partyplan-api:${API_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-1001}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-partyplan};Username=${POSTGRES_USER:-partyplan};Password=${POSTGRES_PASSWORD:?};Maximum Pool Size=40

      # ---------- Authentification ----------
      Jwt__Issuer: https://${DOMAIN_API}
      Jwt__Audience: partyplan-app
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY manquant dans .env}

      # ---------- Amorçage de l'administrateur — RG-ADM-09 à RG-ADM-12 ----------
      # Douze caractères minimum, sinon refus de démarrer (RG-ADM-11). Le mot de
      # passe devra être changé à la première connexion (RG-ADM-10), après quoi
      # ADMIN_PASSWORD peut être vidé et la pile redéployée (RG-ADM-12).
      Admin__Email: ${ADMIN_EMAIL:?ADMIN_EMAIL manquant dans .env}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant dans .env}

      # ---------- Domaines ----------
      # L'application web, et elle seule : la vitrine est un site statique qui
      # n'appelle jamais l'API. Lui ouvrir CORS élargirait la surface pour un
      # besoin qui n'existe pas.
      Cors__AllowedOrigins__0: https://${DOMAIN_APP}
      # C'est l'application web qui répond sur /join/{jeton} et qui sert
      # assetlinks.json : les liens d'invitation portent donc son domaine.
      App__PublicBaseUrl: https://${DOMAIN_APP}
      App__CdnBaseUrl: https://${DOMAIN_CDN}

      # ---------- Médias ----------
      # Sans cette injection, les adresses des photos pointeraient vers
      # localhost : invisible en développement, cassé en production.
      Media__RootPath: /var/lib/partyplan/media
      Media__PublicBaseUrl: https://${DOMAIN_CDN}

      # ---------- Base et limitation de débit ----------
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "false"
      RateLimiting__Enabled: ${RATE_LIMITING_ENABLED:-true}
      RateLimiting__GlobalPerMinute: "300"
      RateLimiting__ShortCodePerMinute: "10"
      RateLimiting__PasswordResetPerHour: "10"
      RateLimiting__AuthAttemptsPerMinute: "20"

      # ---------- Courriel transactionnel ----------
      # Sans ces valeurs, aucun lien de vérification ni de réinitialisation ne
      # part. L'API démarre quand même, mais un compte créé reste non vérifié :
      # c'est le seul service externe réellement nécessaire à l'usage.
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}

      # ---------- Connexions tierces ----------
      # Vides, l'instance fonctionne : aucun bouton Google n'apparaît et
      # l'inscription par mot de passe suffit (NF-DEV-05).
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Google__AndroidClientId: ${GOOGLE_ANDROID_CLIENT_ID}
      Google__IosClientId: ${GOOGLE_IOS_CLIENT_ID}

      # ---------- Notifications poussées ----------
      # Un seul geste : déposer la clé de compte de service Firebase dans
      # `secrets/firebase.json`, à côté de ce compose. Elle reste hors dépôt
      # (.gitignore) et se transfère par scp, jamais par git.
      #
      # Le chemin ci-dessous est celui du fichier **vu de l'intérieur du conteneur**, et
      # c'est le montage juste en dessous qui l'y place. Les deux se répondent : les
      # séparer dans deux fichiers, comme le faisait la variable d'environnement, permet
      # de monter la clé sans la déclarer — l'API retombe alors sur la console, la
      # notification part dans le journal, et rien ne dit pourquoi. C'est exactement la
      # panne constatée le 31/08/2026 sur le NAS, où l'orchestrateur ne lisait pas le
      # `.env` attendu. La variable reste acceptée pour un déploiement qui range sa clé
      # ailleurs, mais elle n'est plus nécessaire. Un tiret seul et non « :- » : la
      # valeur par défaut comble une variable **non définie**, tandis qu'une variable
      # explicitement vidée garde le silence, pour une instance qui ne veut pas de
      # notifications.
      #
      # Le montage porte sur le **répertoire** et non sur le fichier : monter un fichier
      # absent fait créer un répertoire à sa place par Docker, ce qui obligeait à
      # respecter un ordre — donc à se tromper un jour. Un répertoire absent, lui, est
      # créé vide, l'API n'y trouve aucune clé et le dit au démarrage.
      Push__FirebaseServiceAccountPath: ${FIREBASE_SERVICE_ACCOUNT_PATH-/run/secrets/firebase.json}
    volumes:
      - ${DATA_PATH:-./donnees}/media:/var/lib/partyplan/media
      - ./secrets:/run/secrets:ro
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ------------------------------------------------- application web (PWA) ----
  # Attention : l'adresse de l'API et l'identifiant client Google sont inscrits
  # dans le JavaScript à la compilation de l'image (app/Dockerfile, ARG
  # API_BASE_URL et GOOGLE_CLIENT_ID). Les renseigner ici serait sans effet.
  # Ils se posent en variables du dépôt GitHub, puis l'image se reconstruit —
  # voir docs/comptes-externes.md.
  web:
    image: ghcr.io/${GHCR_OWNER:-maxcoeur}/partyplan-web:${APP_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-1003}:80"
    networks:
      - edge

  # ---------------------------------------------------------- site vitrine ----
  # Site statique, indexable, qui n'appelle jamais l'API. Porte aussi les
  # documents légaux exigés par l'écran de consentement Google OAuth.
  landing:
    image: ghcr.io/${GHCR_OWNER:-maxcoeur}/partyplan-landing:${LANDING_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    ports:
      - "${LANDING_PORT:-1000}:80"
    networks:
      - edge

  # ------------------------------------------------------------------ cdn ----
  # Sert les photos depuis le volume partagé avec l'API. En production l'API ne
  # sert pas les fichiers statiques : elle réserve cela au développement, où le
  # domaine statique n'existe pas. Ce conteneur reprend le rôle que Caddy tient
  # dans `compose.example.yml`.
  #
  # La configuration nginx par défaut sert /usr/share/nginx/html telle quelle :
  # aucun fichier à déposer. Le montage est en lecture seule. Les deux en-têtes
  # que ce service doit émettre se posent dans NPM — voir l'en-tête de ce
  # fichier, section 2.
  cdn:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    # Démarrer avant `media-init` ferait créer le dossier par Docker, en root.
    depends_on:
      media-init:
        condition: service_completed_successfully
    ports:
      - "${CDN_PORT:-1002}:80"
    volumes:
      - ${DATA_PATH:-./donnees}/media:/usr/share/nginx/html:ro
    networks:
      - edge
    # L'en-tête doit venir d'ici, et pas de l'onglet « Advanced » de NPM : celui-ci
    # le pose au niveau `server`, or NPM a déjà un `add_header` dans son bloc
    # `location /`, qui écrase alors tout le niveau supérieur. La ligne est
    # chargée, valide, et sans effet. Émis par le serveur d'origine, l'en-tête
    # traverse le proxy sans être touché.
    command:
      - sh
      - -ec
      - |
        echo 'server { listen 80; root /usr/share/nginx/html; add_header Access-Control-Allow-Origin * always; }' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'

  # ----------------------------------------------------------- sauvegardes ----
  # Vidage quotidien, rétention 30 jours (NF-OPS-04).
  #
  # Une sauvegarde restée sur la machine ne protège pas de sa perte :
  # `donnees/sauvegardes` doit être recopié hors du NAS. Le plus simple est de
  # placer DATA_PATH sur un dossier partagé déjà synchronisé vers l'extérieur,
  # ou de pointer ce seul montage ailleurs.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ${DATA_PATH:-./donnees}/sauvegardes:/backups
    networks:
      - internal
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'while true; do
         f=/backups/partyplan-$$(date +%Y%m%d-%H%M%S).sql.gz;
         pg_dump -h db -U ${POSTGRES_USER:-partyplan} -d ${POSTGRES_DB:-partyplan} | gzip > "$$f" \
           && echo "sauvegarde $$f" \
           || echo "ECHEC de sauvegarde";
         find /backups -name "partyplan-*.sql.gz" -mtime +30 -delete;
         sleep 86400;
       done'

networks:
  # Base et API : jamais joignable depuis l'extérieur du projet.
  internal:
    internal: true
  # Services que Nginx Proxy Manager doit atteindre par les ports publiés.
  edge: {}
